<div class="room" id="room">

  <!-- ── Wall ── -->
  <section class="wall">

    <!-- Hanging lamps -->
    <div class="lamp lamp-left" aria-hidden="true">
      <div class="lamp-cord"></div>
      <div class="lamp-shade"></div>
      <div class="lamp-bulb"></div>
    </div>
    <div class="lamp lamp-right" aria-hidden="true">
      <div class="lamp-cord"></div>
      <div class="lamp-shade"></div>
      <div class="lamp-bulb"></div>
    </div>

    <!-- Title -->
    <header class="title-block" role="banner">
      <h1 class="site-title">Tamal<br>Rosita</h1>
    </header>

    <!-- Chayanne frame and Games -->
    <div class="gallery">
      <!-- NAIA Game Frame -->
      <a href="https://tamalrosita.itch.io/naia" target="_blank" rel="noopener noreferrer" class="frame-link">
        <div class="frame-game" aria-label="NAIA Game">
          <div class="cartridge">
            <div class="cartridge-top"></div>
            <div class="cartridge-sticker">
              <img src="assets/naia.png" alt="NAIA Cover Art" />
            </div>
          </div>
        </div>
      </a>

      <!-- Main Chayanne Frame -->
      <div class="frame-wrap main-frame">
        <div class="frame" aria-label="Chayanne portrait">
          <img src="assets/chayanne.png" alt="Chayanne" />
        </div>
      </div>

      <!-- Boturini Game Frame -->
      <a href="https://tamalrosita.itch.io/el-tesoro-de-boturini" target="_blank" rel="noopener noreferrer"
        class="frame-link">
        <div class="frame-game" aria-label="El Tesoro de Boturini Game">
          <div class="cartridge">
            <div class="cartridge-top"></div>
            <div class="cartridge-sticker">
              <img src="assets/boturini.png" alt="El Tesoro de Boturini Cover Art" />
            </div>
          </div>
        </div>
      </a>
    </div>

  </section>

  <!-- ── Floor ── -->
  <section class="floor">
    <div class="floor-tiles" aria-hidden="true"></div>

    <div class="floor-content">
      <h2 class="wip-title">SITE UNDER CONSTRUCTION</h2>
      <p class="wip-subtitle">We're hard at work, check back soon!</p>

      <div class="progress-wrap" role="progressbar" aria-label="Build progress" aria-valuenow="45" aria-valuemin="0"
        aria-valuemax="100">
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="progress-label" id="progressLabel">Building...</span>
      </div>

      <div class="social-links">
        <a href="https://tamalrosita.itch.io" target="_blank" rel="noopener noreferrer" class="retro-btn">Our
          itch.io</a>
        <a href="https://oxido.dev" target="_blank" rel="noopener noreferrer" class="retro-btn">My Personal Site</a>
      </div>
    </div>

    {% include footer.html %}
  </section>

</div>
