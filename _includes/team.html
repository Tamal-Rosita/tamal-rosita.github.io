<div class="about-section">
  {% if page.lang == 'es' %}
  <h2 class="about-heading">Conoce al Equipo</h2>
  {% else %}
  <h2 class="about-heading">Meet the Team</h2>
  {% endif %}
  <div class="about-team-grid">
    {% for member in site.data.team %}
    <a href="{{ member.url }}" target="_blank" rel="noopener noreferrer" class="about-skill-card retro-btn" style="text-decoration: none;">
      <h3 class="about-skill-title" style="margin-bottom: 0;">{{ member.name }}</h3>
    </a>
    {% endfor %}
  </div>
</div>
